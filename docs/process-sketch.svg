    <tspan x="70" dy="0">DOS-1 / WBS 1.1.1   |   Software only   |   One isolated laptop   |   Prepared for review</tspan>
  </text>
  <rect x="45" y="145" width="1510" height="270" rx="20" fill="#f4f6fb" stroke="#dbe2ef" stroke-width="2" />
  <text x="70" y="181" font-family="Arial, sans-serif" font-size="19" fill="#54687c" font-weight="700" text-anchor="start">
    <tspan x="70" dy="0">CONTROL AND PROCESS VIEW</tspan>
  </text>
  <rect x="80" y="210" width="400" height="140" rx="16" fill="#ffffff" stroke="#c9d6df" stroke-width="2" />
