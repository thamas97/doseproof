    <tspan x="1342" dy="0">Sensor B</tspan>
  </text>
  <text x="1342" y="951" font-family="Arial, sans-serif" font-size="22" fill="#203448" font-weight="400" text-anchor="start">
    <tspan x="1342" dy="0">Residual (mg/L)</tspan>
    <tspan x="1342" dy="29.700000000000003">Source, time, quality</tspan>
  </text>
  <text x="80" y="890" font-family="Arial, sans-serif" font-size="22" fill="#203448" font-weight="400" text-anchor="start">
