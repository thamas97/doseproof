<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1450" viewBox="0 0 1600 1450" role="img" aria-labelledby="title desc">
  <title id="title">DoseProof DOS-1 simulated treatment-line design</title>
  <desc id="desc">Water enters at a stated flow, receives chlorine from a separate dosing pump, mixes in a contact tank and exits. Sensors A and B use separate adapters to sample the same modeled water state. The desk sends approved commands, the controller acknowledges them and receives actual delivery feedback, and FUXA reads snapshots. Copied records point only toward future DoseProof layers 2-8. Everything shares one laptop. All human review remains pending.</desc>
